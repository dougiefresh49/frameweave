# Common automatic-caption mishearings in tech videos.
#
# Each row is one mangle: ``heard`` is the word or phrase automatic captions
# tend to produce, ``meant`` is the term actually said, and ``context`` is a
# one-phrase pointer to what the term is. `frameweave.format.readme` shows a
# row only when its ``heard`` form occurs in the transcript text, plus every
# row from a ``--glossary`` file. This table is a starting point: add rows as
# real transcripts turn up new mishearings. Wording stays neutral and factual.

