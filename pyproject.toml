[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frameweave"
dynamic = ["version"]
description = "Turn a video into one folder an agent can read."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2026.8.19",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "pillow>=10",
]

[project.optional-dependencies]
local-stt = [
    "whisperx>=3.3",
    "torch>=2.4",
    "torchaudio>=2.4",
]
speakers = [
    "pyannote.audio>=3.1",
]
hosted = [
    "openai>=1.50",
    "groq>=0.11",
]
dedupe = [
    "imagehash>=4.3",
]
mlx = [
    "mlx-whisper>=0.4; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[project.scripts]
frameweave = "frameweave.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/frameweave/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
