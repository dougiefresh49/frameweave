name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install ffmpeg (the tool requires it; tests extract frames and audio)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; else brew install ffmpeg; fi
          ffmpeg -version | head -1

      - name: Sync
        run: uv sync --group dev --extra dedupe

      - name: Ruff
        run: uv run ruff check

      - name: Pytest
        run: uv run pytest

      - name: Launcher
        run: |
          uv tool install --from . frameweave
          PATH="$HOME/.local/bin:/usr/bin:/bin"
          output="$(frameweave --version)"
          echo "$output"
          test "$output" = "frameweave 0.1.0"

      - name: Scrub
        env:
          SCRUB_TERMS: ${{ secrets.SCRUB_TERMS }}
        run: |
          if [ -z "${SCRUB_TERMS}" ]; then
            echo "scrub: no term list in CI, skipped"
            exit 0
          fi
          printf '%s\n' "${SCRUB_TERMS}" > "${RUNNER_TEMP}/scrub-terms.txt"
          FRAMEWEAVE_SCRUB_TERMS="${RUNNER_TEMP}/scrub-terms.txt" bash scripts/scrub.sh
